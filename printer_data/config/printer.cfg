dir_pin: !PB7                                      
enable_pin: !PE0                                   

microsteps: 128
rotation_distance: 32
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PB9                                    
run_current: 0.6
hold_current: 0.3
interpolate: False
#stealthchop_threshold: 999999


# Front Right
[stepper_z2]
step_pin: PE2                                     
dir_pin: !PE1                                      
enable_pin: !PE4                                   

microsteps: 128
rotation_distance: 32
full_steps_per_rotation: 200

[tmc2209 stepper_z2]
