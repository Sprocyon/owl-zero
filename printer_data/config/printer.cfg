# Motor Configuration ----------------------------------------- # 

# A Motor 1
[stepper_y] 
step_pin: PE6                                    
dir_pin: PE5                                     
enable_pin: !PC14                                  
endstop_pin: tmc2209_stepper_y:virtual_endstop

rotation_distance: 40
microsteps: 128
full_steps_per_rotation: 200

position_endstop: 123
position_max: 123
position_min: -2
 
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: True
#use_sensorless_homing: true

[tmc2209 stepper_y]
uart_pin: PC13                                      
diag_pin: PF4                                    
run_current: 0.8
hold_current: 0.4
interpolate: False
#stealthchop_threshold: 999999
driver_SGTHRS: 100

# B Motor 6
[stepper_x] 
step_pin: PG9                                    
dir_pin: PD7                                   
enable_pin: !PG11                                  
endstop_pin: tmc2209_stepper_x:virtual_endstop

rotation_distance: 40
microsteps: 128
full_steps_per_rotation: 200

position_endstop: 132
position_max: 132
position_min: -13

homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: True
#use_sensorless_homing: true

[tmc2209 stepper_x]
uart_pin: PG10                                 
diag_pin: PC15                                    
run_current: 0.8
hold_current: 0.4
interpolate: False
#stealthchop_threshold: 999999
driver_SGTHRS: 100 #95


# Front Left Motor 4
[stepper_z]
step_pin: PB4                                 
dir_pin: PB3                                     
enable_pin:!PB6                                  

microsteps: 128
rotation_distance: 32
full_steps_per_rotation: 200

endstop_pin: probe:z_virtual_endstop  #probe:z_virtual_endstop #toolhead:PROBE_1                                                           
